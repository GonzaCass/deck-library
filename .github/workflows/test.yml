name: Core tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 xvfb fonts-noto-core libsdl2-2.0-0
      - name: Check the game workspace at Deck and compact sizes
        run: xvfb-run -a -s "-screen 0 1280x800x24" env DECK_LIBRARY_UI_TESTS=1 /usr/bin/python3 -m unittest discover -s tests -p test_gui_deck.py -v
  mail-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify client-specific email routing
        run: |
          javac --release 21 -d /tmp/deck-mail-tests community/keycloak-mail/src/xyz/jokerlan/decklibrary/SenderPolicy.java community/keycloak-mail/tests/xyz/jokerlan/decklibrary/SenderPolicyTest.java
          java -cp /tmp/deck-mail-tests xyz.jokerlan.decklibrary.SenderPolicyTest
